<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="50%" stop-color="#050e24" />
      <stop offset="100%" stop-color="#081636" />
    </linearGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#00f0ff" opacity="0.15" />
      <line x1="0" y1="15" x2="30" y2="15" stroke="#38bdf8" stroke-width="0.3" opacity="0.08" />
      <line x1="15" y1="0" x2="15" y2="30" stroke="#38bdf8" stroke-width="0.3" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.3" />
  
  <!-- Subtle Dot Grid -->
  <rect width="900" height="240" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Light Accents -->
  <circle cx="80" cy="50" r="120" fill="#00f0ff" opacity="0.05" filter="blur(40px)" />
  <circle cx="820" cy="190" r="140" fill="#818cf8" opacity="0.05" filter="blur(40px)" />

  <!-- Top-left and Bottom-right HUD Accents -->
  <path d="M 24 45 L 24 24 L 45 24" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 876 195 L 876 216 L 855 216" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <circle cx="876" cy="24" r="3" fill="#38bdf8" opacity="0.6" />
  <circle cx="24" cy="216" r="3" fill="#38bdf8" opacity="0.6" />

  <!-- Top Sub-Badge -->
  <g transform="translate(450, 48)">
    <rect x="-170" y="-14" width="340" height="26" rx="13" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35" />
    <circle cx="-150" cy="-1" r="3" fill="#00f0ff" />
    <text x="-138" y="3" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#00f0ff" letter-spacing="1.5">ROBOTICS &amp; EMBEDDED SYSTEMS ARCHITECT</text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="118" text-anchor="middle" font-family="'Inter', 'Space Grotesk', 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="url(#cyanGrad)" filter="url(#neonGlow)" letter-spacing="2">
    ALWIN T R
  </text>

  <!-- Engineering Discipline Subtitle -->
  <text x="450" y="156" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8" letter-spacing="0.8">
    Autonomous Mobile Robots (AMR) • Real-Time Embedded Firmware (FreeRTOS) • Industrial Automation
  </text>

  <!-- Feature Pills Footer -->
  <g transform="translate(450, 196)">
    <!-- Pill 1 -->
    <rect x="-340" y="-13" width="155" height="25" rx="6" fill="#081636" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="-262" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#7dd3fc">17 GitHub Repositories</text>
    
    <!-- Pill 2 -->
    <rect x="-165" y="-13" width="155" height="25" rx="6" fill="#081636" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="-87" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#7dd3fc">ESP32 • FreeRTOS • PIC</text>
    
    <!-- Pill 3 -->
    <rect x="10" y="-13" width="155" height="25" rx="6" fill="#081636" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="88" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#7dd3fc">24GHz mmWave Radar</text>

    <!-- Pill 4 -->
    <rect x="185" y="-13" width="155" height="25" rx="6" fill="#081636" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="263" y="3.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#7dd3fc">Portfolio: alwintr.github.io</text>
  </g>
</svg>